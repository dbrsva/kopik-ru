:root{--cream:#FFF7E6;--bg:#FFFBF3;--misty:color-mix(in srgb,#A9B7C6 36%,#FFFFFF);--blush:#F7C8D3;--rose:#B46A72;--sage:#A8B58A;--mist:#A9B7C6;--lagoon:#2D3A47;--gold:#F5C242;--surface:#FFFFFF;--panel:color-mix(in srgb,var(--blush) 20%,var(--bg));--line:color-mix(in srgb,var(--lagoon) 12%,transparent);--sagetx:#55663A;--rosetx:#A25963;--f:'Recoleta','Lora','DM Sans',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--lagoon);font:400 17px/1.5 var(--f)}
h1,h2,h3,p{margin:0}button{touch-action:manipulation;font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:12px}
header{max-width:1120px;margin:0 auto;padding:22px 24px 14px;display:flex;align-items:center;gap:14px}
.logo{font:600 30px var(--f);color:var(--rosetx);letter-spacing:-.01em}
.sp{margin-left:auto}
main{max-width:1120px;margin:0 auto;padding:0 24px 70px}
.btn{font:500 16px var(--f);padding:13px 26px;border:0;border-radius:999px;background:var(--rose);color:#fff;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px var(--rose)}.btn:active{transform:scale(.97)}
.btn.out{background:none;color:var(--lagoon);box-shadow:inset 0 0 0 2px var(--line)}.btn.out:hover{box-shadow:inset 0 0 0 2px var(--mist)}
.btn.sage{background:var(--sage);color:#2D3A47}.btn.sm{padding:8px 18px;font-size:15px}
.lnk{border:0;background:none;color:var(--rosetx);font:500 15px var(--f);padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.muted{opacity:.68;font-size:15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stage{display:grid;grid-template-columns:1.02fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"tot scene" "foc scene";column-gap:10px;background:var(--panel);border-radius:40px;padding:46px 50px 34px;overflow:hidden}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"tot" "scene" "foc";padding:28px 22px 24px;border-radius:32px}.focus{max-width:none}}
#tot{grid-area:tot}#foc{grid-area:foc}.scene{grid-area:scene}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{background:var(--misty);border-radius:999px;padding:5px 14px;font:500 14px var(--f)}
.total{font:600 clamp(46px,6.4vw,78px)/1.02 var(--f);letter-spacing:-.025em;margin-top:2px}
.focus{margin-top:30px;padding-top:24px;border-top:1px solid var(--line);max-width:460px}
.focus h2{font:600 28px/1.2 var(--f)}.fn{margin-top:6px;font-size:19px}.fn b{font-weight:600;font-size:24px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 8px}.bar i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .8s cubic-bezier(.3,.7,.2,1)}
.acts{margin-top:18px}
.scene{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:380px;padding-top:70px}
.kop{width:232px;flex:none;margin-right:6px;position:relative;z-index:2;cursor:pointer;transform:rotate(var(--t,0deg));transition:transform .5s cubic-bezier(.3,.7,.2,1);-webkit-tap-highlight-color:transparent}
.khop{transform-origin:50% 100%}.kbody{position:relative;aspect-ratio:720/1071;transform-origin:50% 100%;animation:breathe 4.8s ease-in-out infinite}
.kf{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;user-select:none}.kf.on{opacity:1}.sc{position:absolute;left:40.5%;top:-18%;width:13%;aspect-ratio:1;border-radius:50%;background:#F5C242;border:2px solid #DFA52A;opacity:0}.sc.go{animation:sc .95s ease-in forwards}
@keyframes sc{0%{top:-18%;opacity:0}15%{opacity:1}72%{top:19%;opacity:1;transform:scale(.85)}100%{top:23%;opacity:0;transform:scale(.4,.2)}}
.khop.party{animation:party 1.5s ease-in-out}
@keyframes party{0%{transform:scale(1.06,.93)}15%{transform:translateY(-34px) rotate(-7deg)}30%{transform:scale(1.05,.94)}45%{transform:translateY(-34px) rotate(7deg)}60%{transform:scale(1.05,.94)}78%{transform:translateY(-16px) rotate(-3deg)}100%{transform:none}}
.jarw{width:250px;flex:none;position:relative;z-index:1}.jarw svg{width:100%;display:block;overflow:visible}.lv{font:600 15px var(--f);fill:var(--rosetx)}
.bub{position:absolute;left:6%;top:6px;max-width:230px;background:var(--surface);padding:10px 16px;border-radius:20px 20px 20px 6px;font:500 16px/1.35 var(--f);box-shadow:0 8px 22px -14px var(--lagoon);z-index:3;transition:opacity .3s}
.cn{transform-box:fill-box}.cn.drop{animation:drop .9s cubic-bezier(.45,0,.75,.55) both}.cn.ghost{animation:ghost 1s ease-in both}
@keyframes breathe{50%{transform:scale(1.012,.985)}}
@keyframes drop{0%{transform:translateY(var(--fy));opacity:0}12%{opacity:1}72%{transform:translateY(0)}86%{transform:translateY(-5px)}100%{transform:translateY(0);opacity:1}}
@keyframes ghost{0%{transform:translateY(var(--fy));opacity:0}15%{opacity:1}80%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.khop.hop{animation:hop .85s cubic-bezier(.3,.7,.3,1)}.khop.squish{animation:squish .45s ease-out}.khop.sad{animation:sad 1.3s ease-in-out}
@keyframes hop{0%{transform:scale(1.07,.92)}28%{transform:translateY(-30px) scale(.97,1.04)}58%{transform:translateY(0) scale(1.06,.93)}100%{transform:none}}
@keyframes squish{35%{transform:scale(1.08,.9)}70%{transform:scale(.98,1.03)}}
@keyframes sad{45%{transform:scale(1.02,.94) rotate(-1.6deg)}}
@media(max-width:700px){body{font-size:16px}header{padding:16px 18px 10px}.logo{font-size:26px}main{padding:0 14px 60px}.stage{padding:22px 16px 20px;border-radius:28px}.total{font-size:clamp(40px,13vw,56px)}.scene{min-height:300px;padding-top:64px}.kop{width:42vw;max-width:190px;margin-right:2px}.jarw{width:40vw;max-width:190px}.bub{left:2%;max-width:62%;font-size:15px}.focus{margin-top:18px;padding-top:18px}.acts .btn{flex:1 1 40%;padding:14px 12px;min-height:48px}.acts .btn:first-child{flex-basis:100%}.btn.sm{min-height:40px}.g{padding:14px 12px}.cols{margin-top:36px;gap:32px}.chips{margin-left:0;width:100%}.chip{padding:7px 14px}.x{padding:10px 8px;font-size:24px}.md{width:78px}.ov{align-items:end;padding:0}.sheet{max-width:none;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}.sheet .btn{flex:1;min-height:48px}.am{font-size:16px}}
.cols{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;margin-top:54px}@media(max-width:900px){.cols{grid-template-columns:1fr;gap:40px}}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}.sh h2{font:600 28px var(--f)}.awbox{background:var(--misty);border-radius:28px;padding:22px 18px}
.g{display:grid;grid-template-columns:1fr auto;gap:0 16px;width:100%;text-align:left;border:0;background:none;padding:16px 18px;border-radius:22px;transition:background .2s}
.g:hover{background:color-mix(in srgb,var(--panel) 55%,transparent)}.g.on{background:var(--panel);box-shadow:inset 4px 0 0 var(--rose)}
.g .n{font:500 19px var(--f)}.g .p{font:600 19px var(--f)}.g .bar{grid-column:1/-1;height:6px;margin:8px 0 6px}.g .s{grid-column:1/-1;font-size:14px;opacity:.68}
.chip{border:0;background:none;box-shadow:inset 0 0 0 2px var(--line);border-radius:99px;padding:4px 14px;font:500 14px var(--f)}.chip.on{background:var(--blush);color:#2D3A47;box-shadow:none}
.chips{display:flex;gap:6px;margin-left:auto}
.day{font:500 15px var(--f);opacity:.65;margin:16px 0 2px}
.it{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 20px var(--f);flex:none;color:#2D3A47}.dep .dot{background:var(--sage)}.wd .dot{background:var(--mist)}

.x{border:0;background:none;opacity:.4;font-size:22px;padding:0 4px}.x:hover{opacity:1}
.medals{display:flex;flex-wrap:wrap;gap:18px 14px;margin-top:6px}.md{width:92px;text-align:center;font-size:14px;line-height:1.25}
.md .c{width:62px;height:62px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:28px;margin:0 auto 8px;box-shadow:inset 0 0 0 4px #FFE08A}
.md.lock{opacity:.5}.md.lock .c{background:color-mix(in srgb,var(--lagoon) 10%,transparent);box-shadow:none;filter:grayscale(1)}
.empty{padding:26px 4px;opacity:.75}
.ov{position:fixed;inset:0;background:rgba(45,58,71,.5);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:30px;padding:28px;width:100%;max-width:430px;display:flex;flex-direction:column;gap:14px}.sheet h3{font:600 26px var(--f)}
label{display:flex;flex-direction:column;gap:5px;font:500 15px var(--f)}
input,select{font:400 17px var(--f);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--lagoon)}
.err{color:var(--rosetx);font-weight:500;min-height:1.4em;font-size:15px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--lagoon);color:var(--cream);padding:12px 22px;border-radius:99px;font:500 16px var(--f);z-index:60;opacity:0;pointer-events:none;transition:.3s}#toast.on{opacity:1;transform:translateX(-50%)}

<script>
const KEY='kopik_v1';let S={tx:[],goals:[],ach:{},sel:null};
(function(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&typeof r==='object'){S.tx=Array.isArray(r.tx)?r.tx.filter(t=>t&&t.amount>0&&t.id):[];S.goals=Array.isArray(r.goals)?r.goals.filter(g=>g&&g.id&&g.target>0):[];S.ach=r.ach&&typeof r.ach==='object'?r.ach:{};S.sel=r.sel||null}}catch(e){}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽',uid=()=>Math.random().toString(36).slice(2,9);
const pl=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2]};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),dkey=d=>new Date(d).toLocaleDateString('en-CA');
const bal=()=>S.tx.reduce((a,t)=>a+(t.type==='deposit'?t.amount:-t.amount),0);
const saved=g=>Math.max(0,S.tx.filter(t=>t.goalId===g.id).reduce((a,t)=>a+(t.type==='deposit'?t.amount:-t.amount),0));
const pct=g=>Math.min(100,Math.floor(saved(g)/g.target*100));
const gname=id=>{const g=S.goals.find(x=>x.id===id);return g?(g.emoji?g.emoji+' ':'')+g.name:''};
const focus=()=>S.goals.find(g=>g.id===S.sel)||S.goals.find(g=>!g.completedAt)||S.goals[0]||null;
function streaks(){const days=[...new Set(S.tx.filter(t=>t.type==='deposit').map(t=>dkey(t.createdAt)))].sort(),n=k=>Math.round(new Date(k+'T00:00:00')/864e5);
let best=0,run=0,prev=null;for(const d of days){const x=n(d);run=prev!==null&&x-prev===1?run+1:1;best=Math.max(best,run);prev=x}
const t=n(dkey(Date.now()));return{cur:days.length&&t-prev<=1?run:0,best,done:days.includes(dkey(Date.now()))}}
const ACH=[['first','Первая монета','Сделай первое пополнение','🪙',c=>c.deps>=1],['s3','3 дня подряд','Пополняй копилку 3 дня подряд','🔥',c=>c.best>=3],['s7','7 дней подряд','Пополняй копилку 7 дней подряд','⭐',c=>c.best>=7],['s30','30 дней подряд','Пополняй копилку 30 дней подряд','👑',c=>c.best>=30],['k1','1 000 ₽','Накопи 1 000 ₽','🌱',c=>c.bal>=1e3],['k10','10 000 ₽','Накопи 10 000 ₽','🌸',c=>c.bal>=1e4],['k100','100 000 ₽','Накопи 100 000 ₽','💎',c=>c.bal>=1e5],['d10','Копилка в деле','Сделай 10 пополнений','🐾',c=>c.deps>=10],['goal','Цель взята','Достигни первой цели','🎯',c=>c.goals>=1]];
function checkAch(){const c={deps:S.tx.filter(t=>t.type==='deposit').length,best:streaks().best,bal:bal(),goals:S.goals.filter(g=>g.completedAt).length},o=[];ACH.forEach(a=>{if(!S.ach[a[0]]&&a[4](c)){S.ach[a[0]]=Date.now();o.push(a)}});return o}
/* jar */
const JAR='M40 76Q40 52 62 52H158Q180 52 180 76V250Q180 285 145 285H75Q40 285 40 250Z',NMAX=56;
const coinsFor=g=>saved(g)<=0?0:Math.max(1,Math.min(NMAX,Math.round(saved(g)/g.target*NMAX)));
function pos(i){let r=0,k=i;for(;;){const cap=r%2?5:6;if(k<cap)break;k-=cap;r++}return[(r%2?66:55)+k*22+((i*37)%5-2)*.8,272-r*18-(i*53)%3,(i*47)%40-20]}
let pending=null;
function jar(g){const n=g?coinsFor(g):0,mine=pending&&g&&pending.id===g.id,from=mine?pending.from:n;let c='';
for(let i=0;i<n;i++){const[p,q,r]=pos(i);c+=`<g transform="translate(${p} ${q}) rotate(${r})"><g class="cn${i>=from?' drop':''}" style="--fy:${62-q}px;animation-delay:${(i-from)*.11}s"><use href="#coin"/></g></g>`}
if(mine&&pending.dep&&n<=from){const[p,q,r]=pos(n);c+=`<g transform="translate(${p} ${q})"><g class="cn ghost" style="--fy:${62-q}px"><use href="#coin"/></g></g>`}
const top=n?pos(n-1)[1]-15:276;
return`<svg viewBox="0 0 250 310" role="img" aria-label="Копилка заполнена на ${g?pct(g):0}%"><defs><g id="coin"><circle r="10.5" fill="#F5C242" stroke="#DFA52A" stroke-width="1.6"/><circle r="7.4" fill="none" stroke="#E8B23A"/><polygon points="0,-5 1.5,-1.6 5,-1.5 2.3,.8 3.1,4.4 0,2.4 -3.1,4.4 -2.3,.8 -5,-1.5 -1.5,-1.6" fill="#FFE08A"/></g><clipPath id="jc"><path d="${JAR}"/></clipPath></defs>
<ellipse cx="110" cy="298" rx="80" ry="7" fill="#2D3A47" opacity=".1"/><path d="${JAR}" fill="#fff" fill-opacity=".4"/><g clip-path="url(#jc)">${c}</g>
<path d="${JAR}" fill="none" stroke="var(--mist)" stroke-width="3.5"/><path d="M58 84V214" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".65"/>
<rect x="52" y="26" width="116" height="27" rx="10" fill="var(--rose)"/><rect x="82" y="37" width="56" height="5" rx="2.5" fill="#8A4952"/>
${n?`<line x1="186" x2="202" y1="${top}" y2="${top}" stroke="var(--rosetx)" stroke-width="2" stroke-dasharray="3 3"/><text x="207" y="${top+5}" class="lv">${pct(g)}%</text>`:''}</svg>`}
/* kopik */
let pokes=0,pt,bt;
function anim(c,ms){const e=$('#khop');e.className='khop';void e.offsetWidth;e.className='khop '+c;clearTimeout(anim.t);anim.t=setTimeout(()=>e.className='khop',ms)}
function spin(){anim('party',1500)}
function coinIn(){const s=$('#sc');s.classList.remove('go');void s.offsetWidth;s.classList.add('go')}
function msg(){const s=streaks(),g=focus();if(!S.goals.length&&!S.tx.length)return'Привет, я Копик! Создай цель, и я сохраню твои монетки.';
if(s.cur>0&&!s.done)return'Сегодня ещё не было пополнений. Не прерывай серию: '+s.cur+' '+pl(s.cur,['день','дня','дней'])+'!';if(g&&!g.completedAt&&saved(g)>0)return '«'+g.name+'»: уже '+pct(g)+'%. Так держать!';if(g&&g.completedAt)return'«'+g.name+'» готова. Что дальше?';return'Каждая монетка важна.'}
function say(t,ms=3200){const b=$('#bub');b.textContent=t||msg();clearTimeout(bt);if(t)bt=setTimeout(()=>say(),ms)}
const LINES=['Хи-хи, щекотно.','Я охраняю монетки.','Каждая монетка важна.','Может, пополним копилку сегодня?','Смотри, как блестит!'];
function poke(){anim('squish',450);pokes++;clearTimeout(pt);pt=setTimeout(()=>pokes=0,1300);if(pokes>=5){pokes=0;spin();say('Уиии!')}else say(LINES[Math.floor(Math.random()*LINES.length)],2400)}
function confetti(){const cl=['#F7C8D3','#B46A72','#A8B58A','#A9B7C6','#F5C242'];for(let i=0;i<44;i++){const d=document.createElement('div');d.className='cf';d.style.cssText=`left:${Math.random()*100}%;background:${cl[i%5]};--dx:${Math.random()*180-90}px;animation-delay:${Math.random()*.5}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),3300)}}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3200)}
/* views */
let filter='all',modal=null;
function renderAll(){const f=focus(),s=streaks(),open=S.goals.filter(g=>!g.completedAt).length;
$('#tot').innerHTML=`<div class="muted">Накоплено всего</div><div class="total">${fmt(bal())}</div><div class="pills">${S.goals.length?`<span class="pill">${open} ${pl(open,['активная цель','активные цели','активных целей'])}</span>`:''}<span class="pill">${s.cur?'Серия: '+s.cur+' '+pl(s.cur,['день','дня','дней']):'Серии пока нет'}</span></div>`;
$('#foc').innerHTML=(f?`<div class="focus"><h2>${esc(f.emoji)} ${esc(f.name)}</h2><div class="fn"><b>${fmt(saved(f))}</b> из ${fmt(f.target)}</div><div class="bar"><i style="width:${pct(f)}%"></i></div><div class="muted">${f.completedAt?'Цель достигнута. Молодец!':'Осталось '+fmt(Math.max(0,f.target-saved(f)))}</div><div class="row acts"><button class="btn" onclick="openTx('deposit','${f.id}')">Пополнить</button><button class="btn out" onclick="openTx('withdrawal','${f.id}')">Снять</button><button class="btn out" onclick="openGoal('${f.id}')">Изменить цель</button></div></div>`
:`<div class="focus"><h2>Начни с цели</h2><p class="muted" style="margin-top:6px">Назови, на что копишь, укажи сумму и смотри, как наполняется банка.</p><div class="row acts"><button class="btn" onclick="openGoal()">Создать цель</button></div></div>`);
$('#jarw').innerHTML=jar(f);
$('#goals').innerHTML=S.goals.length?S.goals.map(g=>`<button class="g ${f&&g.id===f.id?'on':''}" onclick="S.sel='${g.id}';save();pending=null;renderAll();say()"><span class="n">${esc(g.emoji)} ${esc(g.name)}</span><span class="p">${g.completedAt?'Готово':pct(g)+'%'}</span><span class="bar"><i style="width:${pct(g)}%"></i></span><span class="s">${fmt(saved(g))} из ${fmt(g.target)}</span></button>`).join(''):'<div class="empty">Целей пока нет. Первая создаётся за десять секунд.</div>';
$('#chips').innerHTML=[['all','Все'],['deposit','Пополнения'],['withdrawal','Снятия']].map(c=>`<button class="chip ${filter===c[0]?'on':''}" onclick="filter='${c[0]}';renderAll()">${c[1]}</button>`).join('');
const l=S.tx.filter(t=>filter==='all'||t.type===filter).sort((a,b)=>b.createdAt-a.createdAt).slice(0,60);let last='';
$('#act').innerHTML=l.length?l.map(t=>{const d=new Date(t.createdAt).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}),h=d!==last?`<div class="day">${d}</div>`:'';last=d;const dep=t.type==='deposit';
return h+`<div class="it ${dep?'dep':'wd'}"><div class="dot">${dep?'+':'−'}</div><div><div>${esc(t.note)||(dep?'Пополнение':'Снятие')}</div><div class="muted">${new Date(t.createdAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}${gname(t.goalId)?', '+esc(gname(t.goalId)):''}</div></div><div class="am">${dep?'+':'−'}${fmt(t.amount)}</div><button class="x" aria-label="Удалить запись" onclick="delTx('${t.id}')">×</button></div>`}).join(''):'<div class="empty">Пока пусто. Добавь первую монетку, и она появится здесь.</div>';
$('#mc').textContent=Object.keys(S.ach).length+' из '+ACH.length;
$('#med').innerHTML=ACH.map(a=>`<div class="md ${S.ach[a[0]]?'':'lock'}" title="${a[2]}"><div class="c">${a[3]}</div>${a[1]}</div>`).join('');
$('#modal').innerHTML=modal?modalHtml():'';const i=$('#amt')||$('#gn');if(modal&&i)i.focus()}
function modalHtml(){const m=modal,cl='<button class="btn out" onclick="closeM()">Отмена</button>';
if(m.type==='goal'){const g=S.goals.find(x=>x.id===m.id);return`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet" onkeydown="if(event.key==='Enter')saveGoal()"><h3>${g?'Изменить цель':'Новая цель'}</h3><label>Название<input id="gn" maxlength="30" placeholder="Новый MacBook" value="${esc(g&&g.name)}"></label><label>Нужная сумма, ₽<input id="ga" type="number" min="1" inputmode="numeric" placeholder="150000" value="${g?g.target:''}"></label><label>Эмодзи (по желанию)<input id="ge" maxlength="4" placeholder="💻" value="${esc(g&&g.emoji)}"></label><p class="err" id="err"></p><div class="row">${cl}<button class="btn" onclick="saveGoal()">${g?'Сохранить':'Создать цель'}</button></div>${g?'<button class="lnk" id="dg" onclick="delGoal()">Удалить цель</button>':''}</div></div>`}
const dep=m.type==='deposit',gs=S.goals.filter(g=>dep?!g.completedAt||g.id===m.goalId:saved(g)>0);
return`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet" onkeydown="if(event.key==='Enter')addTx()"><h3>${dep?'Пополнить копилку':'Снять деньги'}</h3><label>Сумма, ₽<input id="amt" type="number" min="1" step="1" inputmode="numeric" placeholder="1000"></label>
<div class="row">${[100,500,1000,5000].map(v=>`<button class="chip" onclick="$('#amt').value=${v}">${fmt(v)}</button>`).join('')}</div>
<label>Заметка (по желанию)<input id="note" maxlength="60" placeholder="${dep?'Оплата за заказ':'Покупка книги'}"></label>
<label>${dep?'Цель':'Снять с цели'}<select id="gsel"><option value="">Без цели</option>${gs.map(g=>`<option value="${g.id}" ${g.id===m.goalId?'selected':''}>${esc(g.emoji)} ${esc(g.name)}</option>`).join('')}</select></label>
<p class="err" id="err"></p><div class="row">${cl}<button class="btn ${dep?'sage':''}" onclick="addTx()">${dep?'Пополнить':'Снять'}</button></div></div></div>`}
const err=t=>{$('#err').textContent=t};
function openTx(type,goalId){modal={type,goalId};renderAll()}function openGoal(id){modal={type:'goal',id};renderAll()}function closeM(){modal=null;renderAll()}
function celebrate(g){g.completedAt=Date.now();spin();confetti();say('Цель достигнута: '+g.name+'!',4200)}
function addTx(){const type=modal.type,amt=Math.floor(+$('#amt').value),gid=$('#gsel').value||undefined,g=S.goals.find(x=>x.id===gid);
if(!(amt>0))return err('Введи сумму больше нуля.');
if(type==='withdrawal'&&amt>bal())return err('Нельзя снять больше, чем накоплено ('+fmt(bal())+').');
if(type==='withdrawal'&&g&&amt>saved(g))return err('На этой цели только '+fmt(saved(g))+'.');
const dep=type==='deposit',from=g?coinsFor(g):0;
S.tx.push({id:uid(),type,amount:amt,note:$('#note').value.trim(),goalId:gid,createdAt:Date.now()});
if(g){S.sel=g.id;pending={id:g.id,from:dep?from:coinsFor(g),dep}}else pending=null;
const done=dep&&g&&!g.completedAt&&saved(g)>=g.target;if(!dep&&g&&g.completedAt&&saved(g)<g.target)delete g.completedAt;
if(done)g.completedAt=Date.now();const ach=checkAch();save();modal=null;renderAll();
if(done){coinIn();celebrate(g)}else if(dep){anim('hop',900);coinIn();say('Спасибо! +'+fmt(amt))}else{anim('sad',1300);say('Пока-пока, монетки… −'+fmt(amt))}
if(ach.length)setTimeout(()=>{toast('Новая награда: '+ach.map(a=>a[1]).join(', '));if(!done)confetti()},done?1300:500)}
function saveGoal(){const n=$('#gn').value.trim(),t=Math.floor(+$('#ga').value);if(!n)return err('Дай цели название.');if(!(t>0))return err('Укажи сумму цели больше нуля.');
const g=S.goals.find(x=>x.id===modal.id);let done=false;
if(g){g.name=n;g.target=t;g.emoji=$('#ge').value.trim();if(saved(g)>=t&&!g.completedAt)done=true;else if(saved(g)<t)delete g.completedAt}
else{const ng={id:uid(),name:n,target:t,emoji:$('#ge').value.trim(),createdAt:Date.now()};S.goals.push(ng);S.sel=ng.id}
pending=null;modal=null;checkAch();save();renderAll();if(done){celebrate(g);save()}else say(g?'Готово, обновила!':'Новая цель: '+n+'. Наполним банку!',3000)}
function delGoal(){const b=$('#dg');if(!b.dataset.s){b.dataset.s=1;b.textContent='Нажми ещё раз. Накопленные деньги останутся в общей сумме.';return}
S.goals=S.goals.filter(g=>g.id!==modal.id);S.tx.forEach(t=>{if(t.goalId===modal.id)delete t.goalId});if(S.sel===modal.id)S.sel=null;pending=null;modal=null;save();renderAll();say()}
function delTx(id){S.tx=S.tx.filter(t=>t.id!==id);pending=null;save();renderAll()}
function resetAll(){const b=$('#rs');if(b.dataset.s){S={tx:[],goals:[],ach:{},sel:null};pending=null;save();b.dataset.s='';b.textContent='Сбросить все данные';renderAll();say()}else{b.dataset.s=1;b.textContent='Нажми ещё раз, чтобы удалить всё'}}
const kop=$('#kop'),scene=$('#scene');
kop.addEventListener('click',poke);kop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke()}});
scene.addEventListener('pointermove',e=>{const r=scene.getBoundingClientRect();kop.style.setProperty('--t',((e.clientX-r.left)/r.width-.4)*7+'deg')});
scene.addEventListener('pointerleave',()=>kop.style.setProperty('--t','0deg'));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeM()});
renderAll();say();
</script></body></html>
